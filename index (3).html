<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calcular</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    /* Importar a fonte VT323 do Google Fonts */
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

/* Reset geral */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Animação fade-in geral */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}

/* Efeito neon sutil */
@keyframes neonGlowSoft {
  0%, 100% {
    text-shadow: 0 0 3px #0f0;
    color: #0f0;
  }
  50% {
    text-shadow: 0 0 5px #7fff7f;
    color: #7fff7f;
  }
}

@keyframes neonPulseSoft {
  0%, 100% {
    box-shadow: 0 0 4px #0f0;
  }
  50% {
    box-shadow: 0 0 6px #7fff7f;
  }
}

body {
  background-color: #000000;
  font-family: 'VT323', monospace;
  color: #fff;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  animation: fadeIn 1s ease;
}

/* Container principal */
#container {
  background-color: #2b2b2b;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 0 20px #000000aa;
  width: 395px;
  height: 708px;
  animation: fadeIn 0.8s ease-in-out;
  transition: transform 0.3s ease;
}

#container:hover {
  transform: scale(1.01);
}

/* Tela de exibição com neon sutil */
#tela {
  width: 359px;
  height: 85px;
  background: #000;
  color: #0f0;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 2em;
  resize: none;
  margin-bottom: 20px;
  font-family: 'VT323', monospace;
  animation: fadeIn 1.2s ease, neonPulseSoft 3s ease-in-out infinite;
  transition: background 0.4s, color 0.4s;
}

/* Grupos de botões */
.grupo {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  margin-bottom: 15px;
  animation: fadeIn 1.3s ease;
}

.linha {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
}

/* Botões padrão */
button {
  width: 30%;
  margin-bottom: 10px;
  padding: 10px 0;
  font-size: 1.9em;
  background-color: #535353D6;
  border: none;
  border-radius: 10px;
  color: #fff;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  font-family: 'VT323', monospace;
  animation: fadeIn 1.4s ease, neonGlowSoft 3s ease-in-out infinite;
}

.linha button {
  width: 15%;
  padding: 10px 0;
  font-size: 1.4em;
}

/* Botões especiais */
#igual, #ac, #del {
  width: 32%;
}

button:hover {
  background-color: #737373;
  transform: scale(1.05);
}

/* Botão de extras */
#toggleExtras {
  width: 100%;
  margin-bottom: 10px;
  padding: 18px 0;
  font-size: 1.9em;
  background-color: #3a3a3a;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'VT323', monospace;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
  animation: fadeIn 1.5s ease, neonGlowSoft 3s ease-in-out infinite;
}

#toggleExtras:hover {
  background-color: #5a5a5a;
  transform: scale(1.03);
} 
  </style>
</head>
<body>
  <div id="container">
    <textarea id="tela" readonly></textarea>

    <div class="linha" id="linhaOperadores">
      <button class="op">+</button>
      <button class="op">-</button>
      <button class="op">*</button>
      <button class="op">/</button>
      <button class="op">%</button>
    </div>

    <button id="toggleExtras">Mais ▼</button>

    <div class="linha" id="sinaisExtras" style="display: none;">
      <button class="op">√</button>
      <button class="op">^</button>
      <button class="op">log</button>
      <button class="op">ln</button>
      <button class="op">!</button>
      <button class="op">π</button>
    </div>

    <div class="grupo" id="grupoNumeros">
      <button class="num">7</button>
      <button class="num">8</button>
      <button class="num">9</button>
      <button class="num">4</button>
      <button class="num">5</button>
      <button class="num">6</button>
      <button class="num">1</button>
      <button class="num">2</button>
      <button class="num">3</button>
      <button class="num">0</button>
      <button class="num">(</button>
      <button class="num">)</button>
    </div>

    <div class="linha">
      <button id="ac">AC</button>
      <button id="del">DEL</button>
      <button id="igual">=</button>
    </div>
  </div>

  <script>
    const tela = document.getElementById('tela');
const numeros = document.querySelectorAll('.num');
const operadores = document.querySelectorAll('.op');
const igual = document.getElementById('igual');
const ac = document.getElementById('ac');
const del = document.getElementById('del');
const toggleExtras = document.getElementById('toggleExtras');
const sinaisExtras = document.getElementById('sinaisExtras');

// Inserir números
numeros.forEach(btn => {
  btn.addEventListener('click', () => {
    tela.value += btn.textContent;
  });
});

// Inserir operadores
operadores.forEach(btn => {
  btn.addEventListener('click', () => {
    const op = btn.textContent;

    switch (op) {
      case '√':
        tela.value += 'Math.sqrt(';
        break;
      case '^':
        tela.value += '**';
        break;
      case 'log':
        tela.value += 'Math.log10(';
        break;
      case 'ln':
        tela.value += 'Math.log(';
        break;
      case '!':
        tela.value += '!';
        break;
      case 'π':
        tela.value += 'Math.PI';
        break;
      default:
        tela.value += op;
    }
  });
});

// Calcular resultado
igual.addEventListener('click', () => {
  try {
    let expressao = tela.value;

    // Checar operações simples
    const simples = [
      '1+1', '1 - 1', '2-1', '2+2', '2*1', '3-2',
      '3+0', '1*1', '2*2', '4/2'
    ];

    const limpa = expressao.replace(/\s+/g, '');

    if (simples.includes(limpa)) {
      tela.value = 'seu desempregado!';
      return;
    }

    // Resolver fatorial (!)
    expressao = expressao.replace(/(\d+)!/g, (_, n) => {
      let f = 1;
      for (let i = 1; i <= +n; i++) f *= i;
      return f;
    });

    // Avaliar expressão
    tela.value = eval(expressao);
  } catch (err) {
    tela.value = 'Erro';
  }
});

// Apagar último caractere
del.addEventListener('click', () => {
  tela.value = tela.value.slice(0, -1);
});

// Limpar tudo
ac.addEventListener('click', () => {
  tela.value = '';
});

// Mostrar/ocultar extras
toggleExtras.addEventListener('click', () => {
  const visivel = sinaisExtras.style.display === 'flex';
  sinaisExtras.style.display = visivel ? 'none' : 'flex';
  toggleExtras.textContent = visivel ? 'Mais ▼' : 'Menos ▲';
});  
  </script>
</body>
</html>
